# fwgraph-emul 模拟 agent preset（dsh web host 模式）。
# 与挖掘 preset 平行：同样的长会话压缩结构，但人格留空——profile 的
# system-prompt 行（模拟工程师人格）生效。
# 由 vulnagent/dsh/setup.sh 安装到 $DSH_HOME/.agent-presets/fwgraph-emul/。

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
