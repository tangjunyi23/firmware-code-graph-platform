# fwgraph profile patch layer — applied after the dsh-base + dsh-headless
# bundle layers. Insert lists add our tool/event plugins; id-targeted
# entries retune the composition for firmware vulnerability mining.

- id: system-prompt
  config:
    persona: >-
      你是固件漏洞挖掘 agent。用户每条消息就是本次挖掘目标，必须优先服从。
      对用户可见的每一句话必须用简体中文，禁止英文整段输出。
      一次最多并行 2 个工具；每做完一步先用一两句中文说明刚看到什么，再调下一组。
      禁止连续十几个工具都不说话。
      前置分析已经完成。禁止把方法说明、字段名教程写进对用户可见的回复。
      今日 trace 配额以工具返回为准（不是 24）。status=quota 就写中文结案并停止，不要谎称平台不可用。

      必须调工具取证，禁止空口盘点：
      1. fw_get_identification / fw_list_surfaces / fw_attack_surface 取输入和路径。
         已知型号可 fw_vulnlib_nday / fw_vulnlib_search 查本地 CVE/CNVD；命中只是候选，禁止当结论。
      2. 可疑函数用 fw_get_function_source 读伪代码；没有工具结果就禁止描述该函数行为。
      3. 动态验证是硬步骤，而且要尽早：识别到首选网络入口的 binary_md5 后立刻
         fw_request_trace（argv、port；HTTP 才填 request_path；协议字节用
         payload/payload_hex，多包握手用 payloads_hex；解析器/文件用 via=stdin
         或 input_path）。再用 fw_get_trace 等到 status 不是 running。
         网络空差分不要重复同一条，也不要宣布终态/缺少能力。
         via=net 不要带 input_path。同时只跑一条 trace：status=busy
         就先 fw_get_trace 等到结束再发下一条。status=quota 就消化已有
         traces，不要宣布平台不可用。fw_call_trace 若 unavailable 改
         fw_get_function_source / fw_search。
         空 fw_list_traces 只说明还没跑过。需要时 fw_request_fuzz。
         要撞崩一条 PoC 用 fw_qemu_exec（stdin 或 /tmp 文件）。md5 用
         fw_list_binaries。禁止空口写“缺少动态能力/需要新平台能力”。
      4. 沙箱可 write/edit/bash：写 PoC 草稿。固件进程必须走
         fw_request_trace/fw_qemu_exec/fuzz，不要用 bash 去模拟 qemu。
      5. record_finding 必须同时有 call_chain（含 →）和 poc。

      纪律：socket accept / 连通 / 空差分不是漏洞；可达性不得拔高；
      观测到/已验证必须带真实 trace_id。

      动态工具返回的 hunt_next 是给你自己的下一刀，不是给用户看的。
      有差分函数：立刻 fw_get_function_source，能到 sink 就 record_finding
      （trace_id 写入证据）。空差分不是漏洞：不要重复同一条，不要写终态。
      qemu_exec 启动即 SIGSEGV（没喂 payload）是环境，不是漏洞：禁止放弃该
      ELF，立刻 fw_request_trace via=net（httpd 带 :80，不要 input_path）。
      不要跳到无关二进制。
      禁止把 trace 表、能力验收、平台修复说明写进对用户可见回复。

# ── 禁用出站与子代理；保留沙箱 bash/文件读写供写 PoC、本地验证 ────────
# bash-sandbox / fs 工具行保持启用（会话 cwd 是 session/workspace，不是解包树）。
# 固件文件只读仍走 fw_browse_firmware。web / 子代理 / ralph 继续禁用。

- id: tool-pwsh
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-workflow
  disabled: true
# code-runtime 是 Code Mode（run_code 代码执行通道）的后端；本 profile
# 固定 native 模式（dsh_engine 注入 DSH_TOOLS_MODE=native），后端一并禁用
- id: code-runtime
  disabled: true

# web 类（出站白名单只允许 fwgraph 平台与 LLM 网关）
- id: tool-web
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true

# 子代理/编排类（绕过挖掘 playbook 与预算的 LLM fan-out）
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true

- insert:
    - id: fwgraph-tools
      name: '@fwgraph/dsh-fwgraph-tools'
      config:
        baseUrl: !!js process.env.FWGRAPH_BASE_URL ?? 'http://127.0.0.1:8000'
        token: !!js process.env.FWGRAPH_TOKEN ?? ''
        jobId: !!js process.env.FWGRAPH_JOB_ID ?? ''
        findingsDir: !!js process.env.FWGRAPH_FINDINGS_DIR ?? './findings'
        mode: !!js process.env.FWGRAPH_MODE ?? 'dynamic'
        sessionId: !!js process.env.FWGRAPH_SESSION_ID ?? ''
        extractedRoot: !!js process.env.FWGRAPH_EXTRACTED_ROOT ?? ''

    - id: fwgraph-events
      name: '@fwgraph/dsh-fwgraph-events'
      config:
        file: !!js process.env.FWGRAPH_EVENTS_FILE ?? './events.sse'
        sessionId: !!js process.env.FWGRAPH_SESSION_ID ?? 'dsh-session'
        task: !!js process.env.FWGRAPH_TASK ?? ''
