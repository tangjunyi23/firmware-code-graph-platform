# fwgraph 容器化部署。迁移到新机器时：
#   1. 把 .env 放到本目录（或仓库 fwgraph/.env），填 LLM_API_KEY 等
#   2. 数据走命名卷 fwgraph-data，不写本机绝对路径。编排器经 docker.sock
#      起兄弟沙箱时，自动探测 /data 卷的宿主 Source，无需 SANDBOX_HOST_PREFIX
#   3. 迁移包：先 load fwgraph-data:local，再 --profile migrate run --rm seed
#   4. 可选构建上下文：ida / cbmbin 默认本目录空占位；有 IDA 时指向安装目录
#   5. 构建：docker compose -f deploy/docker/docker-compose.yml --profile build build
name: fwgraph

services:
  orchestrator:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      additional_contexts:
        # IDA Pro 安装目录（可选；缺省为空占位目录，镜像内 /opt/ida 为空，
        # 反编译 API 报「未配置/缺 idat」）
        ida: ./ida
        # 含 codebase-memory-mcp 真实二进制的目录（可选；符号链接需先解
        # 引用，如 cp -L ~/.local/bin/codebase-memory-mcp <目录>/）
        cbmbin: ./cbmbin
    image: fwgraph-orchestrator:local
    ports:
      - "8000:8000"
    volumes:
      - fwgraph-data:/data
      - ./ida-drop:/opt/ida-drop
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      # compose v2.24+：缺失不报错。迁移包用本目录 .env；仓库开发用 fwgraph/.env
      - path: .env
        required: false
      - path: ../../fwgraph/.env
        required: false
    environment:
      # 容器内固定路径，覆盖 .env 里可能残留的宿主路径
      FWGRAPH_ROOT: /app/fwgraph
      FWGRAPH_DATA: /data
      VULNAGENT_HOME: /data/vulnagent
      IDA_DROP_DIR: /opt/ida-drop
      EMBA_BACKEND: docker
      EMBA_IMAGE: ${EMBA_IMAGE:-embeddedanalyzer/emba:2.0.3a}
      SANDBOX_BACKEND: docker
    healthcheck:
      # 自签证书用 -k；/login 由 SPA 回退提供，无需鉴权（401 不会出现）
      test: ["CMD", "curl", "-kf", "https://localhost:8000/login", "-o", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # 第一层业务数据镜像：仅迁移时 --profile migrate run --rm seed
  seed:
    image: fwgraph-data:local
    profiles: ["migrate"]
    volumes:
      - fwgraph-data:/data
    restart: "no"

  # 沙箱镜像：仅构建（--profile build build sandbox），不作为服务运行；
  # 运行时由编排器按需 docker run 起兄弟容器
  sandbox:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.sandbox
    image: fwgraph-sandbox:local
    profiles: ["build"]

  # 官方 EMBA 分析镜像（约 36GB）：compose pull 下来，编排器解包时 docker run。
  # 不作为常驻服务。离线机用 docker save/load 同一标签即可。
  emba:
    image: ${EMBA_IMAGE:-embeddedanalyzer/emba:2.0.3a}
    profiles: ["tools"]
    entrypoint: ["true"]
    restart: "no"

volumes:
  fwgraph-data:
    name: fwgraph-data
